plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
}

def versionMajor = 0
def versionMinor = 0
def versionPatch = 0
def versionBuild = 1 // bump for dogfood builds, public betas, etc.

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def readPrivateValue = { String name ->
    def gradleValue = providers.gradleProperty(name).orNull
    if (gradleValue != null && !gradleValue.trim().isEmpty()) {
        return gradleValue
    }

    def envValue = providers.environmentVariable(name).orNull
    if (envValue != null && !envValue.trim().isEmpty()) {
        return envValue
    }

    def localValue = localProperties.getProperty(name)
    if (localValue != null && !localValue.trim().isEmpty()) {
        return localValue
    }

    return ""
}

def buildConfigString = { String value ->
    "\"${value.replace("\\", "\\\\").replace("\"", "\\\"")}\""
}

android {
    namespace "com.sonu.app.splash"
    compileSdk 37

    defaultConfig {
        applicationId "com.sonu.app.splash"
        minSdk 33
        targetSdk 36
        versionCode versionMajor * 10000 + versionMinor * 1000 + versionPatch * 100 + versionBuild
        versionName "${versionMajor}.${versionMinor}.${versionPatch}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "UNSPLASH_ACCESS_KEY",
                buildConfigString(readPrivateValue("UNSPLASH_ACCESS_KEY"))
    }

    ext {
        APP_NAME_DEBUG = "@string/app_name_debug"
        APP_NAME_RELEASE = "@string/app_name_release"
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            debuggable false

            // replace applicationLabel in manifest with appropriate app_name
            manifestPlaceholders = [applicationLabel_1: APP_NAME_RELEASE]
        }

        debug {
            minifyEnabled false
            // for giving a different application id to debug apk
            // to keep debug and release apk at the same time in test device
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"

            // replace applicationLabel in manifest with appropriate app_name
            manifestPlaceholders = [applicationLabel_1: APP_NAME_DEBUG]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

